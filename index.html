<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal TradingView — Pro Pine Script Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome for Pro Trading Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Monaco Code Editor (The Exact Engine of VS Code & TradingView Pine Editor) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <!-- TradingView Charting Widget CDN -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body, html {
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .active-tf {
      background-color: #2962ff !important;
      color: #ffffff !important;
      font-weight: bold;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #2a2e39;
      border-radius: 3px;
    }
    #pinePanel {
      height: 220px;
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none">

  <!-- Header / Top Bar -->
  <header class="h-12 bg-[#1e222d] border-b border-[#2a2e39] flex items-center justify-between px-3 gap-2 shrink-0 z-20">
    <div class="flex items-center gap-2 overflow-x-auto custom-scroll py-1">
      <!-- Market Selector -->
      <div class="flex items-center gap-1.5 font-bold text-white text-xs bg-[#2a2e39] hover:bg-[#363a45] px-2.5 py-1.5 rounded transition cursor-pointer">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse inline-block"></span>
        <select id="marketSelect" class="bg-transparent border-none text-white text-xs font-semibold focus:outline-none cursor-pointer">
          <option value="BINANCE:BTCUSDT" selected>BTC/USDT (Binance)</option>
          <option value="BINANCE:PAXGUSDT">GOLD (PAXG/USDT)</option>
          <option value="OANDA:XAUUSD">GOLD (XAU/USD - OANDA)</option>
          <option value="BINANCE:ETHUSDT">ETH/USDT</option>
          <option value="BINANCE:SOLUSDT">SOL/USDT</option>
          <option value="FOREXCOM:EURUSD">EUR/USD</option>
          <option value="FOREXCOM:GBPUSD">GBP/USD</option>
          <option value="NASDAQ:AAPL">APPLE (AAPL)</option>
          <option value="NASDAQ:NVDA">NVIDIA (NVDA)</option>
        </select>
      </div>

      <!-- Timeframe Group -->
      <div id="tfContainer" class="flex items-center gap-1">
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="1">1m</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="3">3m</button>
        <button class="tf-btn active-tf text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="5">5m</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="15">15m</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="30">30m</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="60">1h</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="240">4h</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="D">1D</button>
        <button class="tf-btn text-xs px-2 py-1 rounded bg-[#2a2e39] hover:bg-[#363a45] transition" data-interval="W">1W</button>
      </div>
    </div>

    <!-- Right Controls: Indicators Modal & Pine Studio Toggle -->
    <div class="flex items-center gap-1.5 shrink-0">
      <!-- Built-in Indicators Quick Selector -->
      <button id="openIndicatorsModalBtn" class="flex items-center gap-1 text-[11px] font-semibold bg-[#2a2e39] hover:bg-[#363a45] text-gray-200 px-2 py-1 rounded transition whitespace-nowrap">
        <i class="fa-solid fa-chart-line text-blue-400"></i>
        <span>Indicators</span>
      </button>

      <!-- Pine Editor Toggle Button -->
      <button id="toggleEditorBtn" class="flex items-center gap-1 text-[11px] font-bold bg-[#2962ff] hover:bg-blue-600 text-white px-2.5 py-1 rounded transition shadow-md whitespace-nowrap">
        <i class="fa-solid fa-code"></i>
        <span>Pine Editor</span>
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1 flex flex-col relative min-h-0 w-full overflow-hidden">
    <!-- TradingView Chart Container -->
    <div id="tv_chart_container" class="flex-1 w-full h-full relative"></div>

    <!-- Advanced Pine Script Studio (Collapsible Bottom Panel) -->
    <div id="pinePanel" class="border-t border-[#2a2e39] bg-[#1e222d] flex flex-col transition-all duration-200 shrink-0 z-30">
      
      <!-- Studio Header / Toolbar -->
      <div class="h-9 bg-[#181b24] px-3 flex items-center justify-between border-b border-[#2a2e39] text-xs">
        <!-- Tabs & Script Selector -->
        <div class="flex items-center gap-2 overflow-x-auto">
          <span class="font-bold text-blue-400 flex items-center gap-1">
            <i class="fa-solid fa-terminal text-[10px]"></i> Pine Editor
          </span>
          <span class="text-gray-600">|</span>
          <select id="scriptPresetsSelect" class="bg-[#2a2e39] text-gray-200 border border-[#363a45] rounded px-2 py-0.5 text-xs font-mono focus:outline-none cursor-pointer">
            <option value="B2_INDICATOR">B2 — VP Edge + DeMarker (Current)</option>
            <option value="B2_STRATEGY">B2 — Full Strategy & Backtester</option>
            <option value="BLANK_INDICATOR">New Blank Indicator (v5)</option>
            <option value="BLANK_STRATEGY">New Blank Strategy (v5)</option>
            <option value="RSI_MACD_TEMPLATE">RSI + MACD Divergence Combo</option>
            <option value="SUPER_TREND">SuperTrend Indicator Template</option>
          </select>
          <span id="activeScriptBadge" class="bg-blue-900/60 text-blue-300 text-[10px] px-2 py-0.5 rounded font-mono border border-blue-700/50">v5</span>
        </div>

        <!-- Studio Actions -->
        <div class="flex items-center gap-2">
          <!-- Save / New / Copy Buttons -->
          <button id="newScriptBtn" title="Create New Script" class="px-2 py-1 rounded bg-[#2a2e39] hover:bg-gray-700 text-gray-200 text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-plus text-xs text-green-400"></i> New
          </button>
          <button id="saveLocalBtn" title="Save to Browser Storage" class="px-2 py-1 rounded bg-[#2a2e39] hover:bg-gray-700 text-gray-200 text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-floppy-disk text-xs text-amber-400"></i> Save
          </button>
          <button id="copyScriptBtn" title="Copy to Clipboard" class="px-2 py-1 rounded bg-[#2a2e39] hover:bg-gray-700 text-gray-200 text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-copy text-xs text-blue-400"></i> <span id="copyBtnText">Copy</span>
          </button>
          <button id="downloadScriptBtn" title="Download as .pine file" class="px-2 py-1 rounded bg-[#2a2e39] hover:bg-gray-700 text-gray-200 text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-download text-xs text-purple-400"></i>
          </button>
          <button id="compileBtn" title="Compile and Validate Script" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-play text-[10px]"></i> Validate & Add
          </button>
          <button id="closeEditorBtn" class="text-gray-400 hover:text-white text-base font-bold px-1">&times;</button>
        </div>
      </div>

      <!-- Monaco Code Editor Host Area -->
      <div id="monacoHost" class="flex-1 w-full bg-[#1e1e1e] relative"></div>

      <!-- Console / Status Footer -->
      <div class="h-6 bg-[#181b24] px-3 flex items-center justify-between text-[11px] text-gray-400 border-t border-[#2a2e39]">
        <div class="flex items-center gap-2" id="editorStatusContainer">
          <i class="fa-solid fa-circle-check text-emerald-400 text-[10px]"></i>
          <span id="editorStatusText">Pine Script syntax validated (Ready to add to chart)</span>
        </div>
        <div class="flex items-center gap-3 text-gray-500">
          <span id="lineColIndicator">Ln 1, Col 1</span>
          <span>UTF-8</span>
          <span class="text-blue-400 font-semibold cursor-pointer hover:underline" onclick="openDocs()">Pine Docs</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Built-in Indicators Modal -->
  <div id="indicatorsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#1e222d] border border-[#2a2e39] w-full max-w-md rounded-lg shadow-2xl flex flex-col overflow-hidden max-h-[85vh]">
      <div class="h-11 px-4 bg-[#181b24] border-b border-[#2a2e39] flex items-center justify-between">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-chart-simple text-blue-400"></i> Indicators & Technical Studies
        </h3>
        <button id="closeIndicatorsModalBtn" class="text-gray-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-3 border-b border-[#2a2e39]">
        <input type="text" id="indicatorSearchInput" placeholder="Search indicator (RSI, EMA, Bollinger, Volume...)" class="w-full bg-[#131722] text-xs text-gray-200 border border-[#2a2e39] rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div id="indicatorsList" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scroll text-xs">
        <!-- Rendered dynamically -->
      </div>
      <div class="p-3 bg-[#181b24] border-t border-[#2a2e39] flex justify-end">
        <button id="applyIndicatorsBtn" class="bg-[#2962ff] hover:bg-blue-600 text-white font-semibold text-xs px-4 py-1.5 rounded transition">
          Apply to Chart
        </button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Preset Scripts Library
    // -------------------------------------------------------------
    const PRESET_SCRIPTS = {
      B2_INDICATOR: `//@version=5
// ═══════════════════════════════════════════════════════════════════════════
//  GOLD 5m — VP edge reversal + DeMarker gate   ·   INDICATOR version
// ═══════════════════════════════════════════════════════════════════════════
indicator("Gold VP edge + DeMarker (B2) — signals", overlay=true,
     max_labels_count=500, max_lines_count=500)

grpP = "Volume profile"
winH1   = input.float(24.0, "profile 1 window (hours)", minval=1, group=grpP)
winH2   = input.float(4.0,  "profile 2 window (hours)", minval=0, group=grpP)
bins    = input.int(50,     "price bins", minval=10, maxval=200, group=grpP)
vaPct   = input.float(70.0, "value area %", minval=50, maxval=95, group=grpP)
refresh = input.int(15,     "recompute every N bars", minval=1, maxval=200, group=grpP)
nearPct = input.float(0.25, "gate: distance to edge (%)", step=0.05, group=grpP)
showVP  = input.bool(true,  "draw levels", group=grpP)
show2   = input.bool(true,  "draw 4h levels too", group=grpP)

grpD = "DeMarker"
dmLen  = input.int(7, "DeMarker length", minval=2, group=grpD)
sigLen = input.int(3, "signal EMA length", minval=1, group=grpD)
osLvl  = input.float(0.20, "oversold", step=0.01, group=grpD)
obLvl  = input.float(0.80, "overbought", step=0.01, group=grpD)

f_demarker(int len) =>
    float dmx = math.max(high - high[1], 0.0)
    float dmn = math.max(low[1] - low, 0.0)
    float sx  = ta.sma(dmx, len)
    float sn  = ta.sma(dmn, len)
    float den = sx + sn
    den > 0 ? sx / den : 0.5

dm  = f_demarker(dmLen)
sig = ta.ema(dm, sigLen)

var array<float> vol1  = array.new_float(bins, 0.0)
var array<float> vol2  = array.new_float(bins, 0.0)
var array<bool>  used1 = array.new_bool(bins, false)
var array<bool>  used2 = array.new_bool(bins, false)

var float vah1 = na
var float val1 = na
var float poc1 = na
var float vah2 = na
var float val2 = na

f_profile(int win, array<float> vArr, array<bool> uArr) =>
    if win < 30 or bar_index < win + 1
        [na, na, na]
    else
        float lo = na
        float hi = na
        for i = 1 to win
            lo := na(lo) ? low[i] : math.min(lo, low[i])
            hi := na(hi) ? high[i] : math.max(hi, high[i])
        if na(lo) or na(hi) or hi <= lo
            [na, na, na]
        else
            float bw = (hi - lo) / bins
            array.fill(vArr, 0.0)
            for i = 1 to win
                int b0 = int(math.floor((low[i]  - lo) / bw))
                int b1 = int(math.floor((high[i] - lo) / bw))
                b0 := math.max(0, math.min(bins - 1, b0))
                b1 := math.max(0, math.min(bins - 1, b1))
                float v = nz(volume[i], 1.0) / (b1 - b0 + 1)
                for k = b0 to b1
                    array.set(vArr, k, array.get(vArr, k) + v)
            float total = array.sum(vArr)
            int pocIdx = 0
            float maxV = -1.0
            for k = 0 to bins - 1
                float v = array.get(vArr, k)
                if v > maxV
                    maxV := v
                    pocIdx := k
            array.fill(uArr, false)
            array.set(uArr, pocIdx, true)
            float acc = array.get(vArr, pocIdx)
            int vLo = pocIdx
            int vHi = pocIdx
            float target = total * vaPct / 100.0
            int guard = 0
            while acc < target and guard < bins
                int bestIdx = -1
                float bestV = -1.0
                for k = 0 to bins - 1
                    if not array.get(uArr, k)
                        float v = array.get(vArr, k)
                        if v > bestV
                            bestV := v
                            bestIdx := k
                if bestIdx < 0
                    break
                array.set(uArr, bestIdx, true)
                acc += bestV
                vLo := math.min(vLo, bestIdx)
                vHi := math.max(vHi, bestIdx)
                guard += 1
            [lo + vLo * bw, lo + (vHi + 1) * bw, lo + (pocIdx + 0.5) * bw]

tfMin = timeframe.in_seconds() / 60.0
w1 = int(math.round(winH1 * 60.0 / tfMin))
w2 = int(math.round(winH2 * 60.0 / tfMin))

if bar_index % refresh == 0
    [a1, b1v, c1] = f_profile(w1, vol1, used1)
    val1 := a1
    vah1 := b1v
    poc1 := c1
    if w2 >= 30
        [a2, b2v, c2] = f_profile(w2, vol2, used2)
        val2 := a2
        vah2 := b2v

f_near(float lvl) =>
    not na(lvl) and math.abs(close - lvl) / close < nearPct / 100.0

bool nearEdge = show2 ? (f_near(val1) or f_near(vah1) or f_near(val2) or f_near(vah2)) : (f_near(val1) or f_near(vah1))
bool longSig  = dm < osLvl and dm < sig and nearEdge
bool shortSig = dm > obLvl and dm > sig and nearEdge

plot(showVP ? vah1 : na, "VAH 24h", color.new(color.orange, 0), 2)
plot(showVP ? val1 : na, "VAL 24h", color.new(color.blue, 0), 2)
plot(showVP ? poc1 : na, "POC 24h", color.new(color.gray, 30), 1, style=plot.style_circles)
plot(showVP and show2 ? vah2 : na, "VAH 4h", color.new(color.orange, 60), 1)
plot(showVP and show2 ? val2 : na, "VAL 4h", color.new(color.blue, 60), 1)

plotshape(longSig,  "long",  shape.triangleup,   location.belowbar, color.new(color.teal, 0),   size=size.small, text="L")
plotshape(shortSig, "short", shape.triangledown, location.abovebar, color.new(color.maroon, 0), size=size.small, text="S")
bgcolor(nearEdge ? color.new(color.yellow, 94) : na)

plot(dm,  "DeMarker", color.new(color.white, 0), display=display.data_window)
plot(sig, "signal",   color.new(color.orange, 0), display=display.data_window)
plot(osLvl, "OS", color.new(color.teal, 100), 1, display=display.data_window)
plot(obLvl, "OB", color.new(color.maroon, 100), 1, display=display.data_window)

alertcondition(longSig,  "B2 long",  "Gold B2 LONG — DM {{plot_0}} edge touched")
alertcondition(shortSig, "B2 short", "Gold B2 SHORT — DM {{plot_0}} edge touched")`,

      B2_STRATEGY: `//@version=5
strategy("Gold VP edge reversal + DeMarker (B2)", overlay=true,
     max_labels_count=500, max_lines_count=500, max_boxes_count=500,
     default_qty_type=strategy.fixed, default_qty_value=1,
     commission_type=strategy.commission.cash_per_contract, commission_value=0.115,
     initial_capital=10000, currency=currency.USD,
     process_orders_on_close=true)

// Strategy Logic with SL & TP
grpR = "Risk"
atrLen  = input.int(14, "ATR length", minval=2, group=grpR)
tpMult  = input.float(5.0, "TP = x * ATR", step=0.5, group=grpR)
slMult  = input.float(1.0, "SL = x * ATR", step=0.5, group=grpR)
maxHold = input.int(30, "max hold (bars)", minval=1, group=grpR)

atrVal = ta.atr(atrLen)
// Long and Short Execution Entries
// strategy.entry("Long", strategy.long, when = longSig)
// strategy.exit("TP/SL", "Long", profit = atrVal * tpMult, loss = atrVal * slMult)`,

      BLANK_INDICATOR: `//@version=5
indicator("My Custom Indicator", overlay=true)

// Inputs
length = input.int(14, "Length")
src = input.source(close, "Source")

// Calculation
ma = ta.sma(src, length)

// Plot
plot(ma, "Simple MA", color=color.blue, linewidth=2)`,

      BLANK_STRATEGY: `//@version=5
strategy("My Custom Strategy", overlay=true, margin_long=100, margin_short=100)

fastMA = ta.sma(close, 14)
slowMA = ta.sma(close, 28)

longCondition = ta.crossover(fastMA, slowMA)
if (longCondition)
    strategy.entry("My Long Entry Id", strategy.long)

shortCondition = ta.crossunder(fastMA, slowMA)
if (shortCondition)
    strategy.entry("My Short Entry Id", strategy.short)`,

      RSI_MACD_TEMPLATE: `//@version=5
indicator("RSI + MACD Signal Suite", overlay=false)

// RSI
rsiLen = input.int(14, "RSI Length")
rsiVal = ta.rsi(close, rsiLen)
plot(rsiVal, "RSI", color=color.purple)
hline(70, "Overbought", color=color.red, linestyle=hline.style_dashed)
hline(30, "Oversold", color=color.green, linestyle=hline.style_dashed)

// MACD
[macdLine, signalLine, histLine] = ta.macd(close, 12, 26, 9)
plot(macdLine, "MACD", color=color.blue)
plot(signalLine, "Signal", color=color.orange)`,

      SUPER_TREND: `//@version=5
indicator("SuperTrend Custom", overlay=true)

atrPeriod = input.int(10, "ATR Period")
factor = input.float(3.0, "Factor")

[supertrend, direction] = ta.supertrend(factor, atrPeriod)
bodyMiddle = plot((open + close) / 2, display=display.none)
upTrend = plot(direction < 0 ? supertrend : na, "Up Trend", color = color.green, style = plot.style_linebr)
downTrend = plot(direction < 0 ? na : supertrend, "Down Trend", color = color.red, style = plot.style_linebr)`
    };

    // Built-in Studies Catalog
    const BUILTIN_STUDIES = [
      { id: "Volume@tv-basicstudies", name: "Volume", active: true },
      { id: "MASimple@tv-basicstudies", name: "Moving Average Simple (SMA)", active: true },
      { id: "RSI@tv-basicstudies", name: "Relative Strength Index (RSI)", active: false },
      { id: "MACD@tv-basicstudies", name: "MACD", active: false },
      { id: "BollingerBands@tv-basicstudies", name: "Bollinger Bands", active: false },
      { id: "Stochastic@tv-basicstudies", name: "Stochastic Oscillator", active: false },
      { id: "ATR@tv-basicstudies", name: "Average True Range (ATR)", active: false },
      { id: "Supertrend@tv-basicstudies", name: "SuperTrend", active: false },
      { id: "IchimokuCloud@tv-basicstudies", name: "Ichimoku Cloud", active: false },
      { id: "ParabolicSAR@tv-basicstudies", name: "Parabolic SAR", active: false },
      { id: "VWAP@tv-basicstudies", name: "VWAP (Volume Weighted Avg Price)", active: false }
    ];

    let currentSymbol = "BINANCE:BTCUSDT";
    let currentInterval = "5";
    let monacoEditor = null;
    let selectedStudies = ["Volume@tv-basicstudies", "MASimple@tv-basicstudies"];

    // -------------------------------------------------------------
    // TradingView SuperCharts Core Widget
    // -------------------------------------------------------------
    function initChart(symbol, interval) {
      document.getElementById('tv_chart_container').innerHTML = '';
      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": interval,
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#1e222d",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_container",
        "hide_side_toolbar": false,
        "studies": selectedStudies,
        "disabled_features": ["use_localstorage_for_settings"],
        "enabled_features": [
          "study_templates",
          "side_toolbar_in_fullscreen_mode",
          "header_in_fullscreen_mode"
        ]
      });
    }

    function createEditorIfReady() {
      if (typeof monaco !== 'undefined') {
        try {
          monaco.languages.register({ id: 'pinescript' });
          monacoEditor = monaco.editor.create(document.getElementById('monacoHost'), {
            value: PRESET_SCRIPTS.B2_INDICATOR,
            language: 'pinescript',
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 12,
            minimap: { enabled: false },
            scrollBeyondLastLine: false,
            wordWrap: 'on'
          });
          monacoEditor.onDidChangeCursorPosition(e => {
            document.getElementById('lineColIndicator').innerText = "Ln " + e.position.lineNumber + ", Col " + e.position.column;
          });
          return true;
        } catch(e) { console.warn(e); }
      }
      return false;
    }

    // Monaco Code Editor Initialization
    try {
      require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        createEditorIfReady();
      });
    } catch (err) {
      console.warn("Monaco loader fallback", err);
    }
    // Fallback polling for monaco
    let monacoPoll = setInterval(() => {
      if (createEditorIfReady()) clearInterval(monacoPoll);
    }, 500);

    // -------------------------------------------------------------
    // UI Event Handlers & Features
    // -------------------------------------------------------------
    const pinePanel = document.getElementById('pinePanel');

    // Toggle Pine Studio
    document.getElementById('toggleEditorBtn').addEventListener('click', () => {
      pinePanel.classList.toggle('hidden');
      if (monacoEditor) monacoEditor.layout();
    });
    document.getElementById('closeEditorBtn').addEventListener('click', () => {
      pinePanel.classList.add('hidden');
    });

    // Preset Script Switcher
    document.getElementById('scriptPresetsSelect').addEventListener('change', (e) => {
      const key = e.target.value;
      if (PRESET_SCRIPTS[key] && monacoEditor) {
        monacoEditor.setValue(PRESET_SCRIPTS[key]);
        const isV6 = PRESET_SCRIPTS[key].includes('@version=6');
        document.getElementById('activeScriptBadge').innerText = isV6 ? 'v6' : 'v5';
        showStatus('Loaded preset: ' + key, 'info');
      }
    });

    // New Script
    document.getElementById('newScriptBtn').addEventListener('click', () => {
      if (monacoEditor) {
        monacoEditor.setValue(PRESET_SCRIPTS.BLANK_INDICATOR);
        document.getElementById('scriptPresetsSelect').value = 'BLANK_INDICATOR';
        showStatus('New blank indicator created', 'info');
      }
    });

    // Save Local Storage
    document.getElementById('saveLocalBtn').addEventListener('click', () => {
      if (monacoEditor) {
        localStorage.setItem('saved_pine_script', monacoEditor.getValue());
        showStatus('Script saved to local storage ✓', 'success');
      }
    });

    // Copy to Clipboard
    document.getElementById('copyScriptBtn').addEventListener('click', () => {
      if (monacoEditor) {
        navigator.clipboard.writeText(monacoEditor.getValue()).then(() => {
          const btn = document.getElementById('copyBtnText');
          btn.innerText = 'Copied!';
          setTimeout(() => btn.innerText = 'Copy', 2000);
          showStatus('Code copied to clipboard ✓', 'success');
        });
      }
    });

    // Download .pine file
    document.getElementById('downloadScriptBtn').addEventListener('click', () => {
      if (monacoEditor) {
        const blob = new Blob([monacoEditor.getValue()], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'MyIndicator.pine';
        a.click();
        showStatus('Downloaded MyIndicator.pine ✓', 'success');
      }
    });

    // Validate & Compile (Simulated Engine & Feedback)
    document.getElementById('compileBtn').addEventListener('click', () => {
      if (!monacoEditor) return;
      const code = monacoEditor.getValue();
      
      // Basic syntax check
      if (!code.includes('indicator(') && !code.includes('strategy(')) {
        showStatus('Error: Missing indicator(...) or strategy(...) declaration', 'error');
        return;
      }

      showStatus('Validating syntax...', 'info');
      setTimeout(() => {
        showStatus('✓ Compiled successfully: Ready on chart. Copy and paste into TradingView Pine Editor.', 'success');
      }, 400);
    });

    function showStatus(msg, type) {
      const container = document.getElementById('editorStatusContainer');
      const text = document.getElementById('editorStatusText');
      text.innerText = msg;
      if (type === 'error') {
        container.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-400 text-[10px]"></i> <span id="editorStatusText" class="text-red-400">' + msg + '</span>';
      } else if (type === 'success') {
        container.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 text-[10px]"></i> <span id="editorStatusText" class="text-emerald-400">' + msg + '</span>';
      } else {
        container.innerHTML = '<i class="fa-solid fa-circle-info text-blue-400 text-[10px]"></i> <span id="editorStatusText" class="text-blue-300">' + msg + '</span>';
      }
    }

    function openDocs() {
      window.open('https://www.tradingview.com/pine-script-docs/welcome/', '_blank');
    }

    // -------------------------------------------------------------
    // Indicators & Studies Modal
    // -------------------------------------------------------------
    const indicatorsModal = document.getElementById('indicatorsModal');
    const indicatorsList = document.getElementById('indicatorsList');

    function renderIndicatorsList(filter = '') {
      indicatorsList.innerHTML = '';
      BUILTIN_STUDIES.filter(s => s.name.toLowerCase().includes(filter.toLowerCase())).forEach(study => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 rounded hover:bg-[#2a2e39] cursor-pointer transition';
        const isChecked = selectedStudies.includes(study.id) ? 'checked' : '';
        item.innerHTML = '<span class="text-gray-200 font-medium">' + study.name + '</span><input type="checkbox" ' + isChecked + ' class="cursor-pointer accent-blue-600 rounded">';
        item.querySelector('input').addEventListener('change', (e) => {
          if (e.target.checked) {
            if (!selectedStudies.includes(study.id)) selectedStudies.push(study.id);
          } else {
            selectedStudies = selectedStudies.filter(id => id !== study.id);
          }
        });
        indicatorsList.appendChild(item);
      });
    }

    document.getElementById('openIndicatorsModalBtn').addEventListener('click', () => {
      renderIndicatorsList();
      indicatorsModal.classList.remove('hidden');
    });
    document.getElementById('closeIndicatorsModalBtn').addEventListener('click', () => {
      indicatorsModal.classList.add('hidden');
    });
    document.getElementById('indicatorSearchInput').addEventListener('input', (e) => {
      renderIndicatorsList(e.target.value);
    });
    document.getElementById('applyIndicatorsBtn').addEventListener('click', () => {
      indicatorsModal.classList.add('hidden');
      initChart(currentSymbol, currentInterval);
    });

    // -------------------------------------------------------------
    // Timeframes & Market Controls
    // -------------------------------------------------------------
    document.querySelectorAll('.tf-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active-tf'));
        btn.classList.add('active-tf');
        currentInterval = btn.getAttribute('data-interval');
        initChart(currentSymbol, currentInterval);
      });
    });

    document.getElementById('marketSelect').addEventListener('change', (e) => {
      currentSymbol = e.target.value;
      initChart(currentSymbol, currentInterval);
    });

    // Start
    initChart(currentSymbol, currentInterval);
  </script>
</body>
</html>
